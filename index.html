<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>LED Hat Controller</title>
</head>
<body>
  <header>
    <div id="connection-status">
      <div id="status" class="pill err" role="status" aria-live="polite">
        <button id="status-toggle" type="button" aria-expanded="false" aria-controls="connection-actions" disabled>
          <svg id="status-linked" class="connection-icon connected" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m10 13 4-4m-6 6-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 11a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-1 1"/></svg>
          <svg id="status-unlinked" class="connection-icon disconnected" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 15-1 1a4 4 0 0 1-6-6l3-3m12 2 1-1a4 4 0 0 1 6 6l-3 3M2 2l20 20M9 3v3m6 12v3M3 9h3m12 6h3"/></svg>
          <span id="status-label">Disconnected</span>
        </button>
      </div>
      <div id="connection-actions" hidden>
        <button id="btn-status-disconnect" type="button" class="danger">Disconnect</button>
      </div>
    </div>
    <div id="status-approach" class="pill muted" role="status" aria-live="polite">Approach: off</div>
    <div id="status-listening" class="pill muted" role="status" aria-live="polite">Listening: off</div>
  </header>
  <div id="banner" role="status" aria-live="polite" hidden></div>
  <div id="share-prompt" role="region" aria-label="Incoming preset transfer" aria-live="polite" hidden></div>
  <main>
    <section id="view-presets" class="view" role="tabpanel" aria-labelledby="tab-presets">
      <div id="presets-content"></div>
    </section>
    <section id="view-custom" class="view" role="tabpanel" aria-labelledby="tab-custom" hidden></section>
    <section id="view-approach" class="view" role="tabpanel" aria-labelledby="tab-approach" hidden></section>
    <section id="view-scan" class="view" role="tabpanel" aria-labelledby="tab-scan" hidden></section>
    <section id="view-sound" class="view" role="tabpanel" aria-labelledby="tab-sound" hidden></section>
    <section id="view-settings" class="view" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <h1>Settings</h1>
      <div id="settings-device"></div>
      <div id="settings-backup"></div>
      <div id="settings-update"></div>
      <div id="settings-scan"></div>
    </section>
  </main>
  <div id="scan-only-actions" hidden>
    <button id="btn-scan-home" type="button">Return home</button>
  </div>
  <nav id="tab-bar" role="tablist" aria-label="Main navigation">
    <button id="tab-presets" role="tab" data-tab="presets" aria-controls="view-presets" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg><span>Presets</span>
    </button>
    <button id="tab-custom" role="tab" data-tab="custom" aria-controls="view-custom" aria-selected="false" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 3 6 6-12 12H3v-6L15 3zm-3 3 6 6M3 15l6 6"/></svg><span>Custom</span>
    </button>
    <button id="tab-approach" role="tab" data-tab="approach" aria-controls="view-approach" aria-selected="false" tabindex="-1" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="3"/><circle cx="19" cy="6" r="3"/><path d="M1 21v-4a4 4 0 0 1 8 0v4m6 0v-4a4 4 0 0 1 8 0v4M9 10l3 3 3-3m-3 3V7"/></svg><span>Approach</span>
    </button>
    <button id="tab-scan" role="tab" data-tab="scan" aria-controls="view-scan" aria-selected="false" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M3 12h18"/><path d="M7 7h3v3H7zm7 7h3v3h-3z"/></svg><span>Scan</span>
    </button>
    <button id="tab-sound" role="tab" data-tab="sound" aria-controls="view-sound" aria-selected="false" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg><span>Sound</span>
    </button>
    <button id="tab-settings" role="tab" data-tab="settings" aria-controls="view-settings" aria-selected="false" tabindex="-1" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 2 3h3l2 3h3l1-3 3-1 2-3-2-2 1-3-2-3h-3l-2-3z"/><circle cx="12" cy="12" r="3"/></svg><span>Settings</span>
    </button>
  </nav>
  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
