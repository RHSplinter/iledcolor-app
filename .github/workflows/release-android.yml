name: Build Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-release-android-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve manual release tag
        id: release_tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run version:check
          RELEASE_TAG="v$(node -p "require('./package.json').version")"
          RELEASE_REF=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$RELEASE_TAG\") | .ref")
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "ref=${RELEASE_REF:-$RELEASE_COMMIT}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ steps.release_tag.outputs.ref }}
          persist-credentials: false
      - name: Validate version and tag
        id: version
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          npm run version:check -- --tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run test:release
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew --no-daemon assembleRelease
      - name: Verify and collect APK
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/led-hat-$RELEASE_TAG-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release/*.apk
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  publish:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: mobile-release-publish-${{ needs.android.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.android.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.android.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release/
      - name: Publish Android app with checksums
        working-directory: release
        run: |
          set -euo pipefail
          APK="led-hat-$RELEASE_TAG-android.apk"
          test -s "$APK"
          sha256sum "$APK" > SHA256SUMS-android.txt
          if ! gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" > /dev/null
          fi
          TAG_COMMIT=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$TAG_COMMIT" != "$RELEASE_COMMIT" ]]; then
            echo "::error::Release tag $RELEASE_TAG resolves to $TAG_COMMIT, expected $RELEASE_COMMIT."
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "LED Hat $RELEASE_TAG" --generate-notes \
              --notes "Android and iOS are built and uploaded independently. Each successful workflow adds its signed app and platform-specific checksums. iOS requires devices registered in the Ad Hoc provisioning profile. See README for installation."
          fi
          gh release upload "$RELEASE_TAG" "$APK" SHA256SUMS-android.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
