name: Build iOS release

# Disabled for automatic tag pushes until Apple signing secrets exist.
# To re-enable, add back:
#   push:
#     tags: ['v*']
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (e.g. v0.1.0), matching package.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-ios-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      ios_enabled: ${{ steps.ios.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate version and tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          npm run version:check -- --tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check optional iOS signing configuration
        id: ios
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS build skipped; missing optional secrets: ${missing[*]}"
            echo "iOS skipped: missing optional signing secrets (${missing[*]}). The independent Android workflow is unaffected." >> "$GITHUB_STEP_SUMMARY"
          fi

  ios:
    needs: prepare
    if: needs.prepare.outputs.ios_enabled == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'
      - name: Prepare iOS signing
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" > "$RUNNER_TEMP/signing-identities.txt"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import datetime
          import os
          import pathlib
          import plistlib
          import re
          import shutil

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          with (temp / "profile.plist").open("rb") as f:
              profile = plistlib.load(f)
          bundle = "com.harrybin.ledhat"
          entitlements = profile["Entitlements"]
          if not entitlements["application-identifier"].endswith("." + bundle):
              raise SystemExit("Provisioning profile must explicitly match " + bundle)
          if not profile.get("ProvisionedDevices") or entitlements.get("get-task-allow", False):
              raise SystemExit("An Ad Hoc distribution profile with registered device UDIDs is required.")
          if profile["ExpirationDate"] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None):
              raise SystemExit("Provisioning profile has expired.")
          identities = re.findall(r'\b[0-9A-F]{40}\b', (temp / "signing-identities.txt").read_text())
          if len(identities) != 1:
              raise SystemExit("The P12 must contain exactly one valid Apple distribution signing identity.")
          team = profile["TeamIdentifier"][0]
          uuid = profile["UUID"]
          destination = pathlib.Path.home() / "Library/Developer/Xcode/UserData/Provisioning Profiles"
          destination.mkdir(parents=True, exist_ok=True)
          installed = destination / (uuid + ".mobileprovision")
          shutil.copyfile(temp / "profile.mobileprovision", installed)
          (temp / "installed-profile-path.txt").write_text(str(installed))
          with (temp / "ExportOptions.plist").open("wb") as f:
              plistlib.dump({
                  "method": "release-testing",
                  "teamID": team,
                  "signingStyle": "manual",
                  "signingCertificate": identities[0],
                  "provisioningProfiles": {bundle: uuid},
                  "manageAppVersionAndBuildNumber": False,
              }, f)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"team={team}\nprofile={uuid}\nidentity={identities[0]}\n")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npm test
      - run: npm run build
      - run: npx cap sync ios
      - name: Archive signed iOS app
        env:
          IOS_TEAM: ${{ steps.signing.outputs.team }}
          IOS_PROFILE: ${{ steps.signing.outputs.profile }}
          IOS_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LEDHat.xcarchive" \
            archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$IOS_TEAM" \
            CODE_SIGN_IDENTITY="$IOS_IDENTITY" PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/release-signing.keychain-db"
      - name: Export and verify IPA
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LEDHat.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ditto -x -k "$RUNNER_TEMP/ios-export/App.ipa" "$RUNNER_TEMP/ipa-check"
          codesign --verify --deep --strict "$RUNNER_TEMP/ipa-check/Payload/App.app"
          mkdir -p release
          cp "$RUNNER_TEMP/ios-export/App.ipa" "release/led-hat-$RELEASE_TAG-ios.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: release/*.ipa
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Remove signing material
        if: always()
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          if [[ -f "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN"
          fi
          if [[ -f "$RUNNER_TEMP/installed-profile-path.txt" ]]; then
            rm -f "$(cat "$RUNNER_TEMP/installed-profile-path.txt")"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist" \
            "$RUNNER_TEMP/signing-identities.txt" "$RUNNER_TEMP/installed-profile-path.txt"

  publish:
    needs: [prepare, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: mobile-release-publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-ios
          path: release/
      - name: Publish iOS app with checksums
        working-directory: release
        run: |
          set -euo pipefail
          IPA="led-hat-$RELEASE_TAG-ios.ipa"
          test -s "$IPA"
          sha256sum "$IPA" > SHA256SUMS-ios.txt
          if ! gh release view "$RELEASE_TAG" --json tagName > /dev/null; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "LED Hat $RELEASE_TAG" --generate-notes \
              --notes "Android and iOS are built and uploaded independently. Each successful workflow adds its signed app and platform-specific checksums. iOS requires devices registered in the Ad Hoc provisioning profile. See README for installation."
          fi
          gh release upload "$RELEASE_TAG" "$IPA" SHA256SUMS-ios.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
